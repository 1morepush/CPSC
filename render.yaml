# Render Blueprint — deploys the FastAPI backend on the free plan.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: mood-tracker-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/snapshot
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: USE_DEMO_MODE
        value: "true"
      # Optional secrets for live-data mode — Render prompts for these
      # in the dashboard on first deploy (sync: false = never in repo).
      - key: HF_TOKEN
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
